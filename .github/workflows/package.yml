name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx vsce package --target ${{ matrix.target }} --allow-missing-repository -o claude-coder-${{ matrix.target }}-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: claude-coder-${{ matrix.target }}
          path: '*.vsix'
